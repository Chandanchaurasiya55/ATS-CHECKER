<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Document / Resume Sheet with folded corner -->
  <path d="M 17 12 L 37 12 L 47 22 L 47 50 C 47 51.6 45.6 53 44 53 L 20 53 C 18.4 53 17 51.6 17 50 Z" 
        fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Folded Corner Triangle -->
  <path d="M 37 12 L 37 20 C 37 21.1 37.9 22 39 22 L 47 22 Z" fill="#CBD5E1" />

  <!-- Resume Content Lines -->
  <rect x="22" y="24" width="13" height="2.5" rx="1.25" fill="#2563EB" />
  <rect x="22" y="30" width="19" height="2" rx="1" fill="#94A3B8" />
  <rect x="22" y="35" width="15" height="2" rx="1" fill="#94A3B8" />
  <rect x="22" y="40" width="10" height="2" rx="1" fill="#94A3B8" />

  <!-- Emerald ATS Verified Badge in Bottom Right -->
  <circle cx="45" cy="45" r="11" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M 40 45 L 43.5 48.5 L 50.5 41.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
